<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chart Animation Studio</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Chart Animation Studio</h1>
    <span class="badge" id="formatBadge">30 fps</span>
  </header>

  <main class="layout">
    <aside class="panel">
      <section>
        <h2>Chart</h2>
        <label>Chart type <select id="template"></select></label>
        <button id="openGallery" class="secondary" type="button">Browse template gallery…</button>
        <label>Preset <select id="preset"></select></label>
        <label data-field="variant">Big Number variant <select id="variant"></select></label>
        <label>Title <input id="title" type="text" /></label>
        <label>Subtitle <input id="subtitle" type="text" /></label>

        <label data-field="valueMode">Data mode
          <select id="valueMode">
            <option value="percent">Percentage (0-100)</option>
            <option value="number">Number</option>
          </select>
        </label>
        <div data-field="csv" class="schema-hint">Expected columns: <code id="schemaHint"></code></div>
        <label data-field="csv">CSV data <textarea id="csv" rows="9" spellcheck="false"></textarea></label>
        <div class="row" data-field="csv">
          <button id="uploadBtn" class="secondary" type="button">Upload CSV…</button>
          <input id="uploadInput" type="file" accept=".csv,text/csv,text/plain" hidden />
        </div>
        <label data-field="highlight">Highlighted category <select id="highlight"></select></label>

        <div class="bignum" data-field="bigNumber">
          <label>Value <input id="bnValue" type="number" step="any" /></label>
          <label>Decimals <input id="bnDecimals" type="number" min="0" max="6" step="1" /></label>
          <label>Prefix <input id="bnPrefix" type="text" maxlength="8" /></label>
          <label>Suffix <input id="bnSuffix" type="text" maxlength="8" /></label>
        </div>
        <label class="inline" data-field="bigNumber">
          <input id="bnSeparators" type="checkbox" /> Thousands separators
        </label>

        <label data-field="orientation">Orientation
          <select id="orientation">
            <option value="vertical">Vertical</option>
            <option value="horizontal">Horizontal</option>
          </select>
        </label>

        <label data-field="stack">Stacking
          <select id="stackMode">
            <option value="regular">Regular — raw values</option>
            <option value="percent">100% stacked — normalized</option>
          </select>
        </label>

        <div class="bignum" data-field="donut">
          <label>Inner radius %<input id="innerRadius" type="number" min="0" max="90" step="1" /></label>
          <label>Segment labels
            <select id="donutDisplay">
              <option value="percent">Share of total</option>
              <option value="value">Source value</option>
            </select>
          </label>
        </div>
        <label class="inline" data-field="donut"><input id="showTotal" type="checkbox" /> Show total in the centre</label>
        <label data-field="donut">Centre caption <input id="centerLabel" type="text" /></label>

        <div class="bignum" data-field="areaOpts">
          <label>Area opacity <input id="areaOpacity" type="number" min="0" max="1" step="0.02" /></label>
          <label class="inline"><input id="showPoints" type="checkbox" /> Show points</label>
        </div>

        <div class="bignum" data-field="scatterOpts">
          <label>X axis title <input id="xTitle" type="text" /></label>
          <label>Y axis title <input id="yTitle" type="text" /></label>
          <label>Symbol size <input id="symbolSize" type="number" min="4" max="200" step="1" /></label>
        </div>

        <label data-field="heatOpts">Cell reveal
          <select id="heatReveal">
            <option value="simultaneous">Simultaneous</option>
            <option value="row">Row by row</option>
          </select>
        </label>

        <div id="dataStatus" class="status"></div>
      </section>

      <section>
        <h2>Composition</h2>
        <label>Background
          <select id="bgMode">
            <option value="solid">Solid color</option>
            <option value="image">Image</option>
            <option value="transparent">Transparent</option>
          </select>
        </label>
        <div class="row" data-field="bgImage">
          <button id="bgUploadBtn" class="secondary" type="button">Upload image…</button>
          <input id="bgUploadInput" type="file" accept="image/png,image/jpeg" hidden />
        </div>
        <label data-field="bgImage">Image fit
          <select id="bgFit">
            <option value="cover">Cover — fill the frame</option>
            <option value="contain">Contain — fit inside</option>
          </select>
        </label>
        <div id="bgStatus" class="status"></div>

        <label class="inline"><input id="motif" type="checkbox" checked /> Brand accent rule</label>
        <button id="chartOnly" class="secondary" type="button">Chart Only</button>
        <button id="showAll" class="secondary" type="button">Show everything</button>
        <div class="toggles" id="visibility"></div>
      </section>

      <section>
        <h2>Colors</h2>
        <label>Theme <select id="theme"></select></label>
        <label>Data colors <select id="dataScheme"></select></label>
        <div id="schemeNote" class="schema-hint"></div>
        <div class="colors">
          <label>Background <input id="cBackground" type="color" /></label>
          <label>Primary <input id="cPrimary" type="color" /></label>
          <label>Accent <input id="cAccent" type="color" /></label>
          <label>Text <input id="cText" type="color" /></label>
        </div>
      </section>

      <section>
        <h2>Animation</h2>
        <label>Duration (seconds) <input id="duration" type="number" min="0.1" max="60" step="0.1" value="1.8" /></label>
        <label>Easing
          <select id="easing">
            <option value="ease-out">Ease out</option>
            <option value="linear">Linear</option>
          </select>
        </label>
        <label data-field="reveal">Reveal
          <select id="reveal">
            <option value="simultaneous">Simultaneous</option>
            <option value="sequential">Sequential</option>
          </select>
        </label>
        <label>Final-frame hold (seconds) <input id="hold" type="number" min="0" max="60" step="0.1" value="1.0" /></label>
        <div id="timelineInfo" class="status"></div>
      </section>

      <section>
        <h2>Export</h2>
        <label>Resolution <select id="resolution"></select></label>
        <label>Format <select id="format"></select></label>
        <label>Filename <input id="filename" type="text" /></label>
        <button id="export" class="primary" type="button">Export MP4</button>
        <div id="exportStatus" class="status"></div>
        <div class="progress"><div id="progressBar"></div></div>
      </section>
    </aside>

    <div class="stage-wrap">
      <div class="stage-tools">
        <button id="replay" class="secondary" type="button">Replay preview animation</button>
        <span class="hint">Preview is the exact composition that will be exported.</span>
      </div>
      <div id="previewFrame" class="preview-frame">
        <div id="preview" class="preview"></div>
      </div>
    </div>
  </main>

  <div id="gallery" class="gallery-overlay" hidden>
    <div class="gallery">
      <div class="gallery-head">
        <h2>Template gallery</h2>
        <button id="closeGallery" class="secondary" type="button">Close</button>
      </div>
      <div id="galleryBody" class="gallery-body"></div>
    </div>
  </div>

  <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
